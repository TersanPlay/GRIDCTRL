<title id="heroTitle">GRIDCTRL · Robô de arquitetura de interfaces</title>
<desc id="heroDesc">Ilustração vetorial em alta definição de um robô branco com tela grafite, olhos iluminados, detalhes laranja e módulos técnicos flutuantes.</desc>
